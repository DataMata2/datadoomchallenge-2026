[project]
name = "cqa"
version = "0.1.0"
description = "Local conversation quality analytics prototype"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic==2.6.0",
    "fastapi==0.162.2",
    "jsonschema>=4,<5",
    "pydantic==2.14.3",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2,<3",
    "pytest>=9,<10",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
